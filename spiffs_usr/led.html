<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>LED Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 32px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-on {
            background: #4CAF50;
            color: white;
        }

        .btn-on:hover {
            background: #45a049;
        }

        .btn-off {
            background: #f44336;
            color: white;
        }

        .btn-off:hover {
            background: #da190b;
        }

        .bg-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: rgba(255, 255, 255, 0.1);
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class='bg-text'>Elecbits</div>
    <div class='container'>
        <h1>LED Control Panel</h1>
        <a href='/on'><button class='btn btn-on'>Turn ON</button></a>
        <a href='/off'><button class='btn btn-off'>Turn OFF</button></a>
    </div>
</body>

</html>
